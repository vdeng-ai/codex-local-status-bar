name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install schema compiler
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin

      - name: Run tests
        run: npm test

      - name: Run syntax and schema checks
        run: npm run check
