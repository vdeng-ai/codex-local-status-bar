name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gjs libglib2.0-bin sqlite3 zip

      - name: Run tests
        run: |
          npm test
          npm run check
          npm run smoke:reader

      - name: Build GNOME Shell extension package
        shell: bash
        run: |
          set -euo pipefail
          UUID='codex-local-status-bar@vdeng-ai.github.io'
          mkdir -p .release/lib .release/icons .release/schemas dist
          cp metadata.json extension.js prefs.js stylesheet.css .release/
          cp lib/rate-limits.js lib/session-reader.js lib/log-reader.js lib/usage-reader.js .release/lib/
          cp icons/codex.svg .release/icons/
          cp schemas/org.gnome.shell.extensions.codex-local-status-bar.gschema.xml .release/schemas/
          (cd .release && zip -r "../dist/${UUID}.shell-extension.zip" .)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/codex-local-status-bar@vdeng-ai.github.io.shell-extension.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
