name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What would this feature help you do?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version of the feature.
    validations:
      required: true

  - type: checkboxes
    id: invariants
    attributes:
      label: Project constraints
      options:
        - label: This can work without reading Codex credentials.
        - label: This can work without adding backend/API polling.
